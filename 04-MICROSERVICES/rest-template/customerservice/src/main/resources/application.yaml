spring:
  application:
    name: customerservice

  datasource:
    url: jdbc:mysql://localhost:3306/customerservicedb
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Surpex@900#

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

