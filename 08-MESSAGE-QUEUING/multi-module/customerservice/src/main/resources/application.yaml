server:
  port: 8080

spring:
  application:
    name: customerservice


clients:
  fraud:
    url: http://localhost:8081    


management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"